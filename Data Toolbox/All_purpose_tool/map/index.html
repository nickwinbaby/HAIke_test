<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>GNSS 工具箱 · 地图选点与围栏绘制</title>
  <link rel="stylesheet" href="vendor/leaflet.css">
  <link rel="stylesheet" href="map.css">
</head>
<body>
  <header>
    <div>
      <h1 id="pageTitle">地图选点与围栏绘制</h1>
      <p id="hint">选择“标注点”后单击地图，可连续标注经纬度点。</p>
    </div>
    <div class="search">
      <div class="search-box">
        <span class="search-icon">⌕</span>
        <input id="searchInput" autocomplete="off" spellcheck="false" placeholder="搜索地点，或输入 纬度,经度">
        <button id="searchClear" class="search-clear" type="button" title="清空搜索">×</button>
        <div id="searchResults" class="search-results"></div>
      </div>
      <button id="searchButton">定位</button>
    </div>
  </header>

  <nav id="toolbar">
    <button id="importKmlButton" data-scope="track">导入 KML</button>
    <input id="kmlFileInput" type="file" accept=".kml,application/vnd.google-earth.kml+xml" multiple hidden>
    <button data-mode="point" data-scope="point">● 标注点</button>
    <button data-mode="circle" data-scope="fence">○ 圆形</button>
    <button data-mode="rect" data-scope="fence">▭ 矩形</button>
    <button data-mode="polygon" data-scope="fence">⬠ 多边形</button>
    <button data-mode="reference" data-scope="fence">📍 地图标记</button>
    <button id="finishButton" data-scope="fence">完成多边形</button>
    <button id="locateButton">⌖ 定位当前位置</button>
    <span class="spacer"></span>
    <label class="track-name-switch" data-scope="track" title="开启后名称常驻地图；关闭后鼠标悬停显示">
      <input id="showTrackNames" type="checkbox">
      <span class="switch-track"></span>
      <span>显示名称</span>
    </label>
    <label class="track-name-size" data-scope="track">字号
      <select id="trackNameSize" disabled title="开启显示名称后可调整字号">
        <option value="14">14 px</option>
        <option value="12" selected>12 px</option>
        <option value="10">10 px</option>
        <option value="8">8 px</option>
        <option value="6">6 px</option>
      </select>
    </label>
    <label class="map-style-control">底图
      <select id="mapStyleSelect" title="切换高德底图样式">
        <option value="8">详细</option>
        <option value="7">简洁</option>
        <option value="satellite">卫星影像</option>
      </select>
    </label>
    <button id="fitButton">显示所有标记点</button>
    <button id="clearButton" class="danger">清空全部</button>
  </nav>

  <main>
    <div id="map"></div>
    <aside id="trackSidebar" class="track-sidebar">
      <div class="track-sidebar-head">
        <div><b>KML / 搜索标记</b><span id="trackFileCount">0 个</span></div>
        <button id="sidebarImportButton" type="button">＋ 导入</button>
      </div>
      <div id="trackFileList" class="track-file-list">
        <div class="track-empty">尚未导入 KML 文件</div>
      </div>
    </aside>
    <div id="tip"></div>
  </main>

  <footer>
    <div id="items"><span class="empty">还没有标注点或围栏</span></div>
    <div class="actions">
      <span id="status">地图保存为 WGS84 坐标</span>
      <button id="applyButton" class="primary">确定并回填主工具</button>
    </div>
  </footer>

  <div id="confirmDialog" class="confirm-dialog" role="dialog" aria-modal="true" aria-labelledby="confirmTitle">
    <div class="confirm-mask" data-confirm-action="cancel"></div>
    <div class="confirm-card">
      <div class="confirm-icon">!</div>
      <div class="confirm-content">
        <h2 id="confirmTitle">删除全部轨迹？</h2>
        <p id="confirmMessage">确定删除全部已加载的 KML 轨迹吗？此操作只清除当前工具中的临时轨迹。</p>
      </div>
      <div class="confirm-actions">
        <button type="button" data-confirm-action="cancel">取消</button>
        <button type="button" id="confirmOkButton" class="confirm-danger">确认删除</button>
      </div>
    </div>
  </div>

  <script src="vendor/leaflet.js"></script>
  <script src="map.js"></script>
</body>
</html>
